[project]
name = "durable-evals"
version = "0.2.0"
description = "Durable eval harness for long-running agent and model evals."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_evals"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
